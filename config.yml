baseURL: "https://javierrobles.es/"
title: Javier Robles - Politólogo y Analista de datos
theme: PaperMod

defaultContentLanguage: es
defaultContentLanguageInSubdir: false

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

disableKinds: [taxonomy, term]

languages:
    es:
        languageName: "ES"
        languageCode: es-ES
        weight: 1
        menus:
            main:
                - name: Libros
                  url: books/
                  weight: 5
                - name: Artículos
                  url: articles/
                  weight: 2
                - name: Radio
                  url: radio/
                  weight: 3
                - name: Proyectos
                  url: projects/
                  weight: 4
                - name: Blog
                  url: https://realpolitiker.substack.com/
                  weight: 6
        params:
            languageAltTitle: Versión en español
            description: "Portfolio personal de Javier Robles Politólogo y Analista de datos, donde se recogen sus artículos, libros, intervenciones en la radio, y proyectos."
            profileMode:
                  enabled: true
                  title: Javier Robles Sánchez
                  subtitle: "Politólogo y sociólogo especializado en análisis y visualización de edatos."
                  imageUrl: picture.jpeg
                  imageWidth: 160
                  imageHeight: 160
                  buttons:
                    - name: Artículos
                      url: articles/
                    - name: Proyectos
                      url: projects/
                    - name: Libros
                      url: books/
                    - name: Radio
                      url: radio/
                    - name: Blog
                      url: https://realpolitiker.substack.com/
            label:
              text: Javier Robles
              icon: favicon.ico
              iconHeight: 18
    en:
        languageName: "EN"
        languageCode: en-US
        weight: 2
        menus:
            main:
                - name: Books
                  url: books/
                  weight: 5
                - name: Articles
                  url: articles/
                  weight: 2
                - name: Radio
                  url: radio/
                  weight: 3
                - name: Projects
                  url: projects/
                  weight: 4
                - name: Blog
                  url: https://realpolitiker.substack.com/
                  weight: 6
        params:
            languageAltTitle: English version
            description: "Personal portfolio of Javier Robles, political scientist and data analyst, with his articles, books, radio appearances, and projects."
            profileMode:
                  enabled: true
                  title: Javier Robles Sánchez
                  subtitle: "Political scientist and sociologist specialised in data analysis and visualisation."
                  imageUrl: picture.jpeg
                  imageWidth: 160
                  imageHeight: 160
                  buttons:
                    - name: Articles
                      url: articles/
                    - name: Projects
                      url: projects/
                    - name: Books
                      url: books/
                    - name: Radio
                      url: radio/
                    - name: Blog
                      url: https://realpolitiker.substack.com/
            label:
              text: Javier Robles
              icon: favicon.ico
              iconHeight: 18

params:
    author: Javier Robles
    # googleAnalyticsID: G-XXXXX
    DateFormat: January 2006
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: []
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    displayFullLangName: false

    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Email
          url: mailto:user@gmail.com
        - name: Substack
          url: https://realpolitiker.substack.com
        - name: LinkedIn
          url: https://linkedin.com/in/javirobsan
        - name: Instagram
          url: https://www.instagram.com/ojo_aldato_/

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
